[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "nemi-learn"
authors = [
    {name = "Maike Sonnewald", email = "maikes@princeton.edu"}]
description = "Code to accompany paper"
readme = "README.rst"
version = "1.0.4"
requires-python = ">=3.7"
dependencies = [
    "umap-learn",
    "scikit-learn",
    "matplotlib",
    "tqdm",
    "numpy",
    "pyyaml"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
full = ["pytest"]
gpu = [
    "cupy-cuda12x",       # cuML comes from RAPIDS (conda); cupy pip wheel listed for convenience
    # RAPIDS/cuML 25.06 forces older satellite libs; cap these so both cuML and
    # the CPU umap path import in the GPU env (base install stays unpinned).
    "scikit-learn<1.6",   # cuML 25.06 needs 1.5.x; 1.6 renamed check_array's finite kwarg
    "umap-learn<0.5.7",   # 0.5.7+ calls sklearn 1.6's ensure_all_finite
    "numpy<2.5",          # numba (via umap-learn / cuML) ceiling
]

[project.scripts]
nemi = "nemi.cli:main"

[tool.setuptools]
packages = ["nemi"]

[project.urls]
"Homepage" = "https://github.com/maikejulie/NEMI"
"Bug Tracker" = "https://github.com/maikejulie/NEMI/issues"
