[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "nemi-learn"
authors = [
    {name = "Maike Sonnewald", email = "maikes@princeton.edu"}]
description = "Code to accompany paper"
readme = "README.rst"
version = "1.0.4"
requires-python = ">=3.7"
dependencies = [
    "umap-learn",
    "scikit-learn",
    "matplotlib",
    "tqdm",
    "numpy",
    "pyyaml"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
full = ["pytest"]
gpu = ["cupy-cuda12x"]   # cuML comes from RAPIDS (conda); cupy pip wheel listed for convenience

[project.scripts]
nemi = "nemi.cli:main"

[tool.setuptools]
packages = ["nemi"]

[project.urls]
"Homepage" = "https://github.com/maikejulie/NEMI"
"Bug Tracker" = "https://github.com/maikejulie/NEMI/issues"
